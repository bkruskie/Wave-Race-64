name: Build

on: [push, pull_request]

jobs:
  build_repo:
    name: Build ROM US REV 1
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ us ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Build Dependencies
      run: make dependencies

    - name: Get the baserom
      env:
        WR64_TOKEN: ${{ secrets.WR64_TOKEN }}
        WR64_REPO: ${{ secrets.WR64_REPO }}
        SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        SECRET_REPO: ${{ secrets.SECRET_REPO }}
      run: |
        echo "=== Secret Check ==="
        echo "WR64_REPO: ${WR64_REPO:-EMPTY}"
        echo "WR64_TOKEN: ${WR64_TOKEN:+SET (${#WR64_TOKEN} chars)}"
        echo "SECRET_REPO: ${SECRET_REPO:-EMPTY}"
        echo "SECRET_TOKEN: ${SECRET_TOKEN:+SET (${#SECRET_TOKEN} chars)}"
        
        REPO="$WR64_REPO"
        TOKEN="$WR64_TOKEN"
        if [ -z "$REPO" ] && [ -n "$SECRET_REPO" ]; then
          REPO="$SECRET_REPO"
        fi
        if [ -z "$TOKEN" ] && [ -n "$SECRET_TOKEN" ]; then
          TOKEN="$SECRET_TOKEN"
        fi
        
        if [ -z "$REPO" ] || [ -z "$TOKEN" ]; then
          echo "ERROR: Missing secrets. REPO=$([ -z "$REPO" ] && echo EMPTY || echo SET), TOKEN=$([ -z "$TOKEN" ] && echo EMPTY || echo SET)"
          echo "Available secrets: WR64_REPO, WR64_TOKEN, SECRET_REPO, SECRET_TOKEN"
          mkdir -p debug
          echo "REPO=$REPO" > debug/secrets.txt
          echo "TOKEN len=${#TOKEN}" >> debug/secrets.txt
          exit 1
        fi
        
        echo "Cloning $REPO..."
        git clone --depth=1 https://x-access-token:$TOKEN@github.com/$REPO.git wr64-secret 2>&1
        echo "=== wr64-secret contents ==="
        ls -la wr64-secret/ 2>&1
        cp -f wr64-secret/baserom.us.z64 ./baserom.us.rev1.z64 2>&1
        ls -la ./baserom.us.rev1.z64 2>&1

    - name: Upload debug info
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-info
        path: debug/

    - name: Extract
      run: make extract

    - name: Build
      run: make

    - name: Generate Progress Report
      run: python3 -m mapfile_parser objdiff_report --version ${{ matrix.version }}

    - name: Upload Progress Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/progress.json

    - name: Discord Progress
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: python3 tools/upload_progress.py --discord_url ${{ secrets.DISCORD_URL }}

    - name: Cleanup
      run: rm -f baserom.us.rev1.z64
