name: Build

on: [push, pull_request]

jobs:
  build_repo:
    name: Build ROM US REV 1
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ us ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        clean: true
        sparse-checkout-cone-mode: true
        fetch-depth: 0
        fetch-tags: false
        submodules: false
        set-safe-directory: true
        allow-unsafe-pr-checkout: false

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Build Dependencies
      run: make dependencies

    - name: Get baserom
      run: |
        echo Ensure
      env:
        BASEROM_KEY: ${{ secrets.BASEROM_KEY }}

    - name: Extract
      run: make extract

    - name: Build
      run: make

    - name: Generate Progress Report
      run: python3 -m mapfile_parser objdiff_report --version ${{ matrix.version }}

    - name: Upload Progress Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/progress.json
