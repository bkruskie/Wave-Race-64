name: Build

on: [push, pull_request]

jobs:
  build_repo:
    name: Build ROM US REV 1
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ us ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        clean: true
        sparse-checkout-cone-mode: true
        fetch-depth: 0
        fetch-tags: false
        submodules: false
        set-safe-directory: true
        allow-unsafe-pr-checkout: false

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Build Dependencies
      run: make dependencies

    - name: Debug - Check secrets
      run: |
        echo "WR64_REPO = [${{ secrets.WR64_REPO }}]"
        echo "WR64_TOKEN = ${SECRET_LEN_1:-${{ secrets.WR64_TOKEN | default: "" }}}"
        if [ -n "${{ secrets.WR64_TOKEN }}" ]; then echo "WR64_TOKEN is set (len: $(echo -n "${{ secrets.WR64_TOKEN }}" | wc -c))"; else echo "WR64_TOKEN is NOT set"; fi
        if [ -n "${{ secrets.SECRET_REPO }}" ]; then echo "SECRET_REPO is set"; else echo "SECRET_REPO is NOT set"; fi
        if [ -n "${{ secrets.SECRET_TOKEN }}" ]; then echo "SECRET_TOKEN is set"; else echo "SECRET_TOKEN is NOT set"; fi
        if [ -n "${{ secrets.SECRET_PASSPHRASE }}" ]; then echo "SECRET_PASSPHRASE is set"; else echo "SECRET_PASSPHRASE is NOT set"; fi

    - name: Get the baserom
      run: |
        # Try WR64_* secrets first, then fall back to LLONSIT_* secrets
        REPO=${{ secrets.WR64_REPO }}
        TOKEN=${{ secrets.WR64_TOKEN }}
        if [ -z "$REPO" ] && [ -n "${{ secrets.SECRET_REPO }}" ]; then
          REPO=${{ secrets.SECRET_REPO }}
        fi
        if [ -z "$TOKEN" ] && [ -n "${{ secrets.SECRET_TOKEN }}" ]; then
          TOKEN=${{ secrets.SECRET_TOKEN }}
        fi
        if [ -z "$REPO" ] || [ -z "$TOKEN" ]; then
          echo "ERROR: Missing REPO or TOKEN secrets"
          echo "REPO is empty: $([ -z "$REPO" ] && echo yes || echo no)"
          echo "TOKEN is empty: $([ -z "$TOKEN" ] && echo yes || echo no)"
          exit 1
        fi
        echo "Cloning baserom repo: $REPO"
        git clone --depth=1 https://x-access-token:$TOKEN@github.com/$REPO.git wr64-secret
        echo "=== Contents of wr64-secret ==="
        ls -la wr64-secret/
        echo "=== Copying baserom ==="
        cp -f wr64-secret/baserom.us.z64 ./baserom.us.rev1.z64
        ls -la ./baserom.us.rev1.z64

    - name: Extract
      run: make extract

    - name: Build
      run: make

    - name: Generate Progress Report
      run: python3 -m mapfile_parser objdiff_report --version ${{ matrix.version }}

    - name: Upload Progress Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/progress.json

    - name: Discord Progress
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: python3 tools/upload_progress.py --discord_url ${{ secrets.DISCORD_URL }}

    - name: Cleanup
      run: rm -f baserom.us.rev1.z64
