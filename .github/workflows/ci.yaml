name: Build

on: [push, pull_request]

jobs:
  build_repo:
    name: Build ROM US REV 1
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        version: [ us ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Build Dependencies
      run: make dependencies

    - name: Get the baserom
      run: |
        echo "Trying to clone wr64-baserom with GITHUB_TOKEN..."
        git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bkruskie/wr64-baserom.git wr64-secret 2>&1 || {
          echo "GITHUB_TOKEN clone failed, trying with WR64_TOKEN..."
          REPO="${{ secrets.WR64_REPO }}"
          TOKEN="${{ secrets.WR64_TOKEN }}"
          if [ -z "$REPO" ]; then REPO="bkruskie/wr64-baserom"; fi
          if [ -z "$TOKEN" ]; then
            REPO="${{ secrets.SECRET_REPO }}"
            TOKEN="${{ secrets.SECRET_TOKEN }}"
          fi
          if [ -n "$REPO" ] && [ -n "$TOKEN" ]; then
            git clone --depth=1 https://x-access-token:$TOKEN@github.com/$REPO.git wr64-secret 2>&1
          else
            echo "ERROR: No valid credentials found. Please check secrets."
            exit 1
          fi
        }
        ls -la wr64-secret/
        cp -f wr64-secret/baserom.us.z64 ./baserom.us.rev1.z64
        ls -la ./baserom.us.rev1.z64

    - name: Extract
      run: make extract

    - name: Build
      run: make

    - name: Generate Progress Report
      run: python3 -m mapfile_parser objdiff_report --version ${{ matrix.version }}

    - name: Upload Progress Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/progress.json

    - name: Discord Progress
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: python3 tools/upload_progress.py --discord_url ${{ secrets.DISCORD_URL }}

    - name: Cleanup
      run: rm -f baserom.us.rev1.z64
