name: Build

on: [push, pull_request]

jobs:
  build_repo:
    name: Build ROM US REV 1
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ us ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Build Dependencies
      run: make dependencies

    - name: Get the baserom
      env:
        WR64_TOKEN: ${{ secrets.WR64_TOKEN }}
        WR64_REPO: ${{ secrets.WR64_REPO }}
        SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        SECRET_REPO: ${{ secrets.SECRET_REPO }}
      run: |
        REPO="$WR64_REPO"
        TOKEN="$WR64_TOKEN"
        if [ -z "$REPO" ] && [ -n "$SECRET_REPO" ]; then
          REPO="$SECRET_REPO"
        fi
        if [ -z "$TOKEN" ] && [ -n "$SECRET_TOKEN" ]; then
          TOKEN="$SECRET_TOKEN"
        fi
        if [ -z "$REPO" ] || [ -z "$TOKEN" ]; then
          echo "ERROR: Missing repo or token secrets"
          echo "WR64_REPO: $([ -n "$WR64_REPO" ] && echo set || echo empty)"
          echo "SECRET_REPO: $([ -n "$SECRET_REPO" ] && echo set || echo empty)"
          echo "WR64_TOKEN: $([ -n "$WR64_TOKEN" ] && echo set || echo empty)"
          echo "SECRET_TOKEN: $([ -n "$SECRET_TOKEN" ] && echo set || echo empty)"
          ls -la
          exit 1
        fi
        echo "Cloning: $REPO"
        git clone --depth=1 https://x-access-token:$TOKEN@github.com/$REPO.git wr64-secret
        ls -la wr64-secret/
        cp -f wr64-secret/baserom.us.z64 ./baserom.us.rev1.z64
        ls -la ./baserom.us.rev1.z64

    - name: Extract
      run: make extract

    - name: Build
      run: make

    - name: Generate Progress Report
      run: python3 -m mapfile_parser objdiff_report --version ${{ matrix.version }}

    - name: Upload Progress Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/progress.json

    - name: Discord Progress
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: python3 tools/upload_progress.py --discord_url ${{ secrets.DISCORD_URL }}

    - name: Cleanup
      run: rm -f baserom.us.rev1.z64
