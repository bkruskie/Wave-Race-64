name: Build

on: [push, pull_request]

jobs:
  build_repo:
    name: Build ROM US REV 1
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ us ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        clean: true
        sparse-checkout-cone-mode: true
        fetch-depth: 0
        fetch-tags: false
        submodules: false
        set-safe-directory: true
        allow-unsafe-pr-checkout: false

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Build Dependencies
      run: make dependencies

    - name: Get extra dependencies
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.WR64_REPO }}
        token: ${{ secrets.WR64_TOKEN }}
        path: wr64-secret

    - name: Debug baserom
      run: |
        echo "WR64_REPO = ${{ secrets.WR64_REPO }}"
        echo "=== Contents of wr64-secret ==="
        ls -la wr64-secret/ 2>&1
        echo "=== Git info ==="
        cd wr64-secret && git log --oneline -5 && git branch -a
        echo "=== File check ==="
        ls -la wr64-secret/baserom.us.z64 2>&1 || echo "NOT FOUND via checkout"

    - name: Get the baserom (fallback: direct download)
      run: |
        if [ -f wr64-secret/baserom.us.z64 ]; then
          cp -f wr64-secret/baserom.us.z64 ./baserom.us.rev1.z64
          echo "Got baserom from checkout"
        else
          echo "Checkout failed, trying direct download..."
          curl -L -s -H "Authorization: token ${{ secrets.WR64_TOKEN }}" \
            "https://github.com/${{ secrets.WR64_REPO }}/raw/main/baserom.us.z64" \
            -o baserom.us.rev1.z64
          echo "Downloaded baserom via API"
        fi
        ls -la ./baserom.us.rev1.z64

    - name: Get the baserom
      run: cp -f wr64-secret/baserom.us.z64 ./baserom.us.rev1.z64

    - name: Extract
      run: make extract

    - name: Build
      run: make

    - name: Generate Progress Report
      run: python3 -m mapfile_parser objdiff_report --version ${{ matrix.version }}

    - name: Upload Progress Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/progress.json

    - name: Discord Progress
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: python3 tools/upload_progress.py --discord_url ${{ secrets.DISCORD_URL }}

    - name: Cleanup
      run: rm -f baserom.us.rev1.z64
